<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dual Calendar Manager</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0f1117;
      --surface: #1a1d27;
      --surface2: #22263a;
      --border: #2e3250;
      --a-primary: #6c8cff;
      --a-light: #1e2a4a;
      --b-primary: #ff7eb3;
      --b-light: #3a1e2d;
      --text: #e8eaf6;
      --text-muted: #7b82a8;
      --accent: #4ade80;
      --danger: #f87171;
      --radius: 10px;
      --shadow: 0 4px 24px rgba(0,0,0,0.4);
    }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ── Header ── */
    header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 14px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
    }
    header h1 { font-size: 1.25rem; font-weight: 700; letter-spacing: -0.5px; }
    header h1 span { color: var(--a-primary); }
    header h1 span.b { color: var(--b-primary); }

    .header-controls { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }

    .nav-btn {
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 6px 14px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.875rem;
      transition: background 0.15s;
    }
    .nav-btn:hover { background: var(--border); }

    .month-label {
      font-size: 1rem;
      font-weight: 600;
      min-width: 160px;
      text-align: center;
    }

    .btn {
      padding: 8px 18px;
      border-radius: 7px;
      border: none;
      cursor: pointer;
      font-size: 0.875rem;
      font-weight: 600;
      transition: opacity 0.15s, transform 0.1s;
    }
    .btn:active { transform: scale(0.97); }
    .btn-a { background: var(--a-primary); color: #fff; }
    .btn-b { background: var(--b-primary); color: #fff; }
    .btn-find { background: var(--accent); color: #111; }
    .btn-danger { background: var(--danger); color: #fff; }
    .btn-neutral { background: var(--surface2); color: var(--text); border: 1px solid var(--border); }
    .btn:hover { opacity: 0.88; }

    /* ── Person Labels ── */
    .persons-bar {
      display: flex;
      gap: 16px;
      padding: 10px 24px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      flex-wrap: wrap;
    }
    .person-chip {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 600;
    }
    .person-chip.a { background: var(--a-light); color: var(--a-primary); border: 1px solid var(--a-primary)44; }
    .person-chip.b { background: var(--b-light); color: var(--b-primary); border: 1px solid var(--b-primary)44; }
    .person-chip input {
      background: transparent;
      border: none;
      color: inherit;
      font-size: inherit;
      font-weight: inherit;
      outline: none;
      width: 120px;
    }

    /* ── Main Grid ── */
    main {
      flex: 1;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0;
      overflow: hidden;
    }

    .calendar-pane {
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      min-height: 0;
    }
    .calendar-pane:last-child { border-right: none; }

    .pane-header {
      padding: 10px 16px;
      font-size: 0.8rem;
      font-weight: 700;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      border-bottom: 1px solid var(--border);
    }
    .pane-header.a { color: var(--a-primary); }
    .pane-header.b { color: var(--b-primary); }

    /* ── Calendar Grid ── */
    .cal-grid {
      flex: 1;
      overflow-y: auto;
      padding: 12px;
    }

    .day-headers {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 2px;
      margin-bottom: 4px;
    }
    .day-header {
      text-align: center;
      font-size: 0.7rem;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      padding: 4px 0;
    }

    .days-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 2px;
    }

    .day-cell {
      min-height: 72px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 4px;
      cursor: pointer;
      transition: background 0.12s;
      position: relative;
      overflow: hidden;
    }
    .day-cell:hover { background: var(--surface2); }
    .day-cell.outside { opacity: 0.3; pointer-events: none; }
    .day-cell.today { border-color: var(--accent); }
    .day-cell.today .day-num { color: var(--accent); font-weight: 700; }

    .day-num {
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-bottom: 3px;
    }

    .event-chip {
      font-size: 0.68rem;
      padding: 2px 5px;
      border-radius: 4px;
      margin-bottom: 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      cursor: pointer;
      font-weight: 600;
    }
    .event-chip.a { background: var(--a-light); color: var(--a-primary); border-left: 2px solid var(--a-primary); }
    .event-chip.b { background: var(--b-light); color: var(--b-primary); border-left: 2px solid var(--b-primary); }
    .event-chip.shared { background: #1a2e20; color: var(--accent); border-left: 2px solid var(--accent); }

    .more-events {
      font-size: 0.65rem;
      color: var(--text-muted);
      padding: 1px 4px;
    }

    /* ── Free Slots Panel ── */
    .free-slots-panel {
      background: var(--surface);
      border-top: 1px solid var(--border);
      padding: 14px 24px;
      display: none;
    }
    .free-slots-panel.open { display: block; }
    .free-slots-panel h3 { font-size: 0.9rem; font-weight: 700; color: var(--accent); margin-bottom: 10px; }
    .slots-list { display: flex; flex-wrap: wrap; gap: 8px; }
    .slot-item {
      background: #1a2e20;
      border: 1px solid var(--accent)44;
      color: var(--accent);
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.12s;
    }
    .slot-item:hover { background: #243d2a; }
    .slots-config { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; margin-bottom: 12px; }
    .slots-config label { font-size: 0.8rem; color: var(--text-muted); }
    .slots-config input, .slots-config select {
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 5px 10px;
      border-radius: 6px;
      font-size: 0.8rem;
    }

    /* ── Modal ── */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.65);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
      display: none;
    }
    .modal-overlay.open { display: flex; }

    .modal {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 24px;
      width: 420px;
      max-width: 95vw;
      box-shadow: var(--shadow);
    }
    .modal h2 { font-size: 1rem; font-weight: 700; margin-bottom: 16px; }

    .form-group { margin-bottom: 14px; }
    .form-group label { display: block; font-size: 0.8rem; color: var(--text-muted); margin-bottom: 5px; }
    .form-group input, .form-group select, .form-group textarea {
      width: 100%;
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 8px 12px;
      border-radius: 7px;
      font-size: 0.875rem;
      outline: none;
      transition: border-color 0.15s;
    }
    .form-group input:focus, .form-group select:focus, .form-group textarea:focus {
      border-color: var(--a-primary);
    }
    .form-group textarea { min-height: 70px; resize: vertical; }

    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

    .modal-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 18px; flex-wrap: wrap; }

    .color-picker { display: flex; gap: 8px; flex-wrap: wrap; }
    .color-swatch {
      width: 28px; height: 28px;
      border-radius: 50%;
      cursor: pointer;
      border: 2px solid transparent;
      transition: transform 0.1s, border-color 0.1s;
    }
    .color-swatch.selected { border-color: #fff; transform: scale(1.2); }

    /* ── Scrollbar ── */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

    /* ── Responsive ── */
    @media (max-width: 700px) {
      main { grid-template-columns: 1fr; }
      .calendar-pane { border-right: none; border-bottom: 1px solid var(--border); }
    }

    .tag-shared {
      font-size: 0.65rem;
      background: #1a2e20;
      color: var(--accent);
      padding: 1px 6px;
      border-radius: 10px;
      margin-left: 6px;
    }

    .empty-state {
      text-align: center;
      padding: 20px;
      color: var(--text-muted);
      font-size: 0.8rem;
    }
  </style>
</head>
<body>

<header>
  <h1>Dual <span>Cal</span><span class="b">endar</span></h1>
  <div class="header-controls">
    <button class="nav-btn" id="prevMonth">&#8592;</button>
    <span class="month-label" id="monthLabel"></span>
    <button class="nav-btn" id="nextMonth">&#8594;</button>
    <button class="nav-btn" id="todayBtn">Today</button>
    <button class="btn btn-find" id="findSlotsBtn">&#9673; Find Free Slots</button>
  </div>
</header>

<div class="persons-bar">
  <div class="person-chip a">
    <span>&#9679;</span>
    <input id="nameA" value="Person A" title="Click to rename" />
  </div>
  <div class="person-chip b">
    <span>&#9679;</span>
    <input id="nameB" value="Person B" title="Click to rename" />
  </div>
  <div style="margin-left:auto;display:flex;gap:8px;">
    <button class="btn btn-a" id="addEventA">+ Add Event</button>
    <button class="btn btn-b" id="addEventB">+ Add Event</button>
  </div>
</div>

<main>
  <div class="calendar-pane" id="paneA">
    <div class="pane-header a" id="headerA">PERSON A</div>
    <div class="cal-grid" id="calA"></div>
  </div>
  <div class="calendar-pane" id="paneB">
    <div class="pane-header b" id="headerB">PERSON B</div>
    <div class="cal-grid" id="calB"></div>
  </div>
</main>

<div class="free-slots-panel" id="freeSlotsPanel">
  <h3>&#10003; Available Time Slots (Both Free)</h3>
  <div class="slots-config">
    <label>Meeting Duration:
      <select id="slotDuration">
        <option value="30">30 min</option>
        <option value="60" selected>1 hour</option>
        <option value="90">1.5 hours</option>
        <option value="120">2 hours</option>
      </select>
    </label>
    <label>Work Hours:
      <input type="time" id="workStart" value="09:00" style="width:100px" />
      <span style="color:var(--text-muted);padding:0 4px">to</span>
      <input type="time" id="workEnd" value="18:00" style="width:100px" />
    </label>
    <label>Days ahead:
      <input type="number" id="daysAhead" value="14" min="1" max="60" style="width:70px" />
    </label>
    <button class="btn btn-find" id="refreshSlots" style="padding:5px 12px;font-size:0.8rem;">Refresh</button>
  </div>
  <div class="slots-list" id="slotsList"></div>
</div>

<!-- Event Modal -->
<div class="modal-overlay" id="eventModal">
  <div class="modal">
    <h2 id="modalTitle">Add Event</h2>
    <div class="form-group">
      <label>Title *</label>
      <input id="evTitle" placeholder="e.g. Team Meeting" />
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>Date *</label>
        <input type="date" id="evDate" />
      </div>
      <div class="form-group">
        <label>Person</label>
        <select id="evPerson">
          <option value="a">Person A</option>
          <option value="b">Person B</option>
          <option value="shared">Both (Shared)</option>
        </select>
      </div>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>Start Time</label>
        <input type="time" id="evStart" value="09:00" />
      </div>
      <div class="form-group">
        <label>End Time</label>
        <input type="time" id="evEnd" value="10:00" />
      </div>
    </div>
    <div class="form-group">
      <label>Notes</label>
      <textarea id="evNotes" placeholder="Optional notes..."></textarea>
    </div>
    <div class="form-group">
      <label>Color</label>
      <div class="color-picker" id="colorPicker"></div>
    </div>
    <div class="modal-actions">
      <button class="btn btn-danger" id="deleteEventBtn" style="margin-right:auto;display:none">Delete</button>
      <button class="btn btn-neutral" id="cancelModal">Cancel</button>
      <button class="btn btn-a" id="saveEvent">Save Event</button>
    </div>
  </div>
</div>

<!-- Event Detail Modal -->
<div class="modal-overlay" id="detailModal">
  <div class="modal">
    <h2 id="detailTitle"></h2>
    <div id="detailBody" style="font-size:0.875rem;color:var(--text-muted);line-height:1.7"></div>
    <div class="modal-actions">
      <button class="btn btn-danger" id="detailDelete">Delete</button>
      <button class="btn btn-neutral" id="detailEdit">Edit</button>
      <button class="btn btn-neutral" id="detailClose">Close</button>
    </div>
  </div>
</div>

<script>
// ─────────────────────────────────────────────
//  STATE
// ─────────────────────────────────────────────
const COLORS = ['#6c8cff','#ff7eb3','#4ade80','#facc15','#fb923c','#a78bfa','#22d3ee','#f87171'];

let state = {
  view: { year: new Date().getFullYear(), month: new Date().getMonth() },
  names: { a: 'Person A', b: 'Person B' },
  events: [], // { id, title, date, start, end, person:'a'|'b'|'shared', color, notes }
  editingId: null,
  freeSlotsOpen: false,
};

function load() {
  try {
    const saved = localStorage.getItem('dualcal_v2');
    if (saved) {
      const parsed = JSON.parse(saved);
      state.names = parsed.names || state.names;
      state.events = parsed.events || [];
    }
  } catch(e) {}
}

function save() {
  localStorage.setItem('dualcal_v2', JSON.stringify({ names: state.names, events: state.events }));
}

function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2); }

// ─────────────────────────────────────────────
//  RENDER CALENDARS
// ─────────────────────────────────────────────
function renderAll() {
  const { year, month } = state.view;

  // Month label
  document.getElementById('monthLabel').textContent =
    new Date(year, month, 1).toLocaleDateString('en-US', { month: 'long', year: 'numeric' });

  // Person names
  document.getElementById('nameA').value = state.names.a;
  document.getElementById('nameB').value = state.names.b;
  document.getElementById('headerA').textContent = state.names.a.toUpperCase();
  document.getElementById('headerB').textContent = state.names.b.toUpperCase();
  document.querySelector('#addEventA').textContent = '+ ' + state.names.a;
  document.querySelector('#addEventB').textContent = '+ ' + state.names.b;
  document.querySelector('#evPerson option[value="a"]').textContent = state.names.a;
  document.querySelector('#evPerson option[value="b"]').textContent = state.names.b;

  renderCalendar('a');
  renderCalendar('b');
  if (state.freeSlotsOpen) renderFreeSlots();
}

function renderCalendar(person) {
  const { year, month } = state.view;
  const el = document.getElementById(person === 'a' ? 'calA' : 'calB');

  const today = new Date();
  today.setHours(0,0,0,0);

  const firstDay = new Date(year, month, 1);
  const lastDay = new Date(year, month + 1, 0);
  const startPad = firstDay.getDay(); // 0=Sun
  const totalCells = Math.ceil((startPad + lastDay.getDate()) / 7) * 7;

  const eventsThisMonth = state.events.filter(e => {
    if (e.person !== person && e.person !== 'shared') return false;
    const d = new Date(e.date + 'T00:00:00');
    return d.getFullYear() === year && d.getMonth() === month;
  });

  const byDay = {};
  eventsThisMonth.forEach(e => {
    const d = new Date(e.date + 'T00:00:00').getDate();
    if (!byDay[d]) byDay[d] = [];
    byDay[d].push(e);
  });

  const DAYS = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  let html = '<div class="day-headers">' + DAYS.map(d => `<div class="day-header">${d}</div>`).join('') + '</div>';
  html += '<div class="days-grid">';

  for (let i = 0; i < totalCells; i++) {
    const dayNum = i - startPad + 1;
    const isOutside = dayNum < 1 || dayNum > lastDay.getDate();
    const cellDate = new Date(year, month, dayNum);
    cellDate.setHours(0,0,0,0);
    const isToday = !isOutside && cellDate.getTime() === today.getTime();
    const dateStr = !isOutside ? `${year}-${String(month+1).padStart(2,'0')}-${String(dayNum).padStart(2,'0')}` : '';

    html += `<div class="day-cell${isOutside?' outside':''}${isToday?' today':''}" data-date="${dateStr}" data-person="${person}">`;
    if (!isOutside) {
      html += `<div class="day-num">${dayNum}</div>`;
      const dayEvents = byDay[dayNum] || [];
      const sorted = [...dayEvents].sort((a,b) => (a.start||'').localeCompare(b.start||''));
      const visible = sorted.slice(0, 3);
      visible.forEach(ev => {
        const cls = ev.person === 'shared' ? 'shared' : person;
        const timeStr = ev.start ? `${ev.start} ` : '';
        html += `<div class="event-chip ${cls}" data-id="${ev.id}" title="${ev.title}">${timeStr}${ev.title}</div>`;
      });
      if (sorted.length > 3) {
        html += `<div class="more-events">+${sorted.length - 3} more</div>`;
      }
    }
    html += '</div>';
  }

  html += '</div>';
  el.innerHTML = html;

  // Click on day cell → add event
  el.querySelectorAll('.day-cell:not(.outside)').forEach(cell => {
    cell.addEventListener('click', e => {
      if (e.target.classList.contains('event-chip')) return;
      openAddModal(cell.dataset.date, cell.dataset.person);
    });
  });

  // Click on event chip → view/edit
  el.querySelectorAll('.event-chip').forEach(chip => {
    chip.addEventListener('click', e => {
      e.stopPropagation();
      openDetailModal(chip.dataset.id);
    });
  });
}

// ─────────────────────────────────────────────
//  ADD / EDIT MODAL
// ─────────────────────────────────────────────
let selectedColor = COLORS[0];

function buildColorPicker(current) {
  selectedColor = current || COLORS[0];
  const cp = document.getElementById('colorPicker');
  cp.innerHTML = COLORS.map(c =>
    `<div class="color-swatch${c === selectedColor ? ' selected' : ''}" style="background:${c}" data-color="${c}"></div>`
  ).join('');
  cp.querySelectorAll('.color-swatch').forEach(sw => {
    sw.addEventListener('click', () => {
      selectedColor = sw.dataset.color;
      cp.querySelectorAll('.color-swatch').forEach(s => s.classList.remove('selected'));
      sw.classList.add('selected');
    });
  });
}

function openAddModal(date, person) {
  state.editingId = null;
  document.getElementById('modalTitle').textContent = 'Add Event';
  document.getElementById('evTitle').value = '';
  document.getElementById('evDate').value = date || '';
  document.getElementById('evPerson').value = person || 'a';
  document.getElementById('evStart').value = '09:00';
  document.getElementById('evEnd').value = '10:00';
  document.getElementById('evNotes').value = '';
  document.getElementById('deleteEventBtn').style.display = 'none';
  buildColorPicker(person === 'b' ? COLORS[1] : COLORS[0]);
  document.getElementById('eventModal').classList.add('open');
  document.getElementById('evTitle').focus();
}

function openEditModal(id) {
  const ev = state.events.find(e => e.id === id);
  if (!ev) return;
  state.editingId = id;
  document.getElementById('modalTitle').textContent = 'Edit Event';
  document.getElementById('evTitle').value = ev.title;
  document.getElementById('evDate').value = ev.date;
  document.getElementById('evPerson').value = ev.person;
  document.getElementById('evStart').value = ev.start || '09:00';
  document.getElementById('evEnd').value = ev.end || '10:00';
  document.getElementById('evNotes').value = ev.notes || '';
  document.getElementById('deleteEventBtn').style.display = 'block';
  buildColorPicker(ev.color);
  document.getElementById('detailModal').classList.remove('open');
  document.getElementById('eventModal').classList.add('open');
  document.getElementById('evTitle').focus();
}

function closeModal() {
  document.getElementById('eventModal').classList.remove('open');
  state.editingId = null;
}

document.getElementById('saveEvent').addEventListener('click', () => {
  const title = document.getElementById('evTitle').value.trim();
  const date = document.getElementById('evDate').value;
  if (!title || !date) { alert('Title and date are required.'); return; }

  const ev = {
    id: state.editingId || uid(),
    title,
    date,
    person: document.getElementById('evPerson').value,
    start: document.getElementById('evStart').value,
    end: document.getElementById('evEnd').value,
    notes: document.getElementById('evNotes').value.trim(),
    color: selectedColor,
  };

  if (state.editingId) {
    const idx = state.events.findIndex(e => e.id === state.editingId);
    state.events[idx] = ev;
  } else {
    state.events.push(ev);
  }

  save();
  closeModal();
  renderAll();
});

document.getElementById('cancelModal').addEventListener('click', closeModal);
document.getElementById('eventModal').addEventListener('click', e => {
  if (e.target === document.getElementById('eventModal')) closeModal();
});

document.getElementById('deleteEventBtn').addEventListener('click', () => {
  if (state.editingId && confirm('Delete this event?')) {
    state.events = state.events.filter(e => e.id !== state.editingId);
    save();
    closeModal();
    renderAll();
  }
});

// ─────────────────────────────────────────────
//  DETAIL MODAL
// ─────────────────────────────────────────────
let detailId = null;

function openDetailModal(id) {
  const ev = state.events.find(e => e.id === id);
  if (!ev) return;
  detailId = id;

  const personName = ev.person === 'shared' ? `${state.names.a} & ${state.names.b}` :
    (ev.person === 'a' ? state.names.a : state.names.b);

  const dateStr = new Date(ev.date + 'T00:00:00').toLocaleDateString('en-US',
    { weekday:'long', year:'numeric', month:'long', day:'numeric' });

  let body = `<strong style="color:var(--text)">${dateStr}</strong><br/>`;
  if (ev.start) body += `Time: ${ev.start}${ev.end ? ' – ' + ev.end : ''}<br/>`;
  body += `Person: <span style="color:${ev.color}">${personName}</span><br/>`;
  if (ev.notes) body += `<br/>${ev.notes}`;

  document.getElementById('detailTitle').textContent = ev.title;
  document.getElementById('detailBody').innerHTML = body;
  document.getElementById('detailModal').classList.add('open');
}

document.getElementById('detailClose').addEventListener('click', () => {
  document.getElementById('detailModal').classList.remove('open');
});
document.getElementById('detailModal').addEventListener('click', e => {
  if (e.target === document.getElementById('detailModal'))
    document.getElementById('detailModal').classList.remove('open');
});
document.getElementById('detailEdit').addEventListener('click', () => {
  if (detailId) openEditModal(detailId);
});
document.getElementById('detailDelete').addEventListener('click', () => {
  if (detailId && confirm('Delete this event?')) {
    state.events = state.events.filter(e => e.id !== detailId);
    save();
    document.getElementById('detailModal').classList.remove('open');
    renderAll();
  }
});

// ─────────────────────────────────────────────
//  NAVIGATION
// ─────────────────────────────────────────────
document.getElementById('prevMonth').addEventListener('click', () => {
  state.view.month--;
  if (state.view.month < 0) { state.view.month = 11; state.view.year--; }
  renderAll();
});
document.getElementById('nextMonth').addEventListener('click', () => {
  state.view.month++;
  if (state.view.month > 11) { state.view.month = 0; state.view.year++; }
  renderAll();
});
document.getElementById('todayBtn').addEventListener('click', () => {
  const now = new Date();
  state.view.year = now.getFullYear();
  state.view.month = now.getMonth();
  renderAll();
});

// Add event buttons
document.getElementById('addEventA').addEventListener('click', () => {
  const today = new Date();
  const dateStr = `${state.view.year}-${String(state.view.month+1).padStart(2,'0')}-${String(today.getDate()).padStart(2,'0')}`;
  openAddModal(dateStr, 'a');
});
document.getElementById('addEventB').addEventListener('click', () => {
  const today = new Date();
  const dateStr = `${state.view.year}-${String(state.view.month+1).padStart(2,'0')}-${String(today.getDate()).padStart(2,'0')}`;
  openAddModal(dateStr, 'b');
});

// Name editing
document.getElementById('nameA').addEventListener('change', e => {
  state.names.a = e.target.value || 'Person A';
  save();
  renderAll();
});
document.getElementById('nameB').addEventListener('change', e => {
  state.names.b = e.target.value || 'Person B';
  save();
  renderAll();
});

// ─────────────────────────────────────────────
//  FREE SLOTS
// ─────────────────────────────────────────────
function timeToMins(t) {
  const [h,m] = t.split(':').map(Number);
  return h * 60 + m;
}
function minsToTime(m) {
  return `${String(Math.floor(m/60)).padStart(2,'0')}:${String(m%60).padStart(2,'0')}`;
}

function renderFreeSlots() {
  const daysAhead = parseInt(document.getElementById('daysAhead').value) || 14;
  const duration = parseInt(document.getElementById('slotDuration').value) || 60;
  const workStart = timeToMins(document.getElementById('workStart').value || '09:00');
  const workEnd = timeToMins(document.getElementById('workEnd').value || '18:00');

  const slots = [];
  const today = new Date();
  today.setHours(0,0,0,0);

  for (let d = 0; d < daysAhead; d++) {
    const date = new Date(today);
    date.setDate(today.getDate() + d);
    const dateStr = `${date.getFullYear()}-${String(date.getMonth()+1).padStart(2,'0')}-${String(date.getDate()).padStart(2,'0')}`;

    // Get busy intervals for both people (including shared)
    const busy = state.events
      .filter(e => e.date === dateStr && e.start && e.end)
      .map(e => [timeToMins(e.start), timeToMins(e.end)]);

    // Merge overlapping busy intervals
    busy.sort((a,b) => a[0]-b[0]);
    const merged = [];
    for (const [s,e] of busy) {
      if (merged.length && s <= merged[merged.length-1][1]) {
        merged[merged.length-1][1] = Math.max(merged[merged.length-1][1], e);
      } else {
        merged.push([s,e]);
      }
    }

    // Find free gaps within work hours
    let cursor = workStart;
    for (const [bs, be] of merged) {
      if (bs > cursor && bs - cursor >= duration) {
        // There's a gap before this busy block
        let slotStart = cursor;
        while (slotStart + duration <= bs) {
          slots.push({ date: dateStr, start: slotStart, end: slotStart + duration, dateObj: date });
          slotStart += duration;
        }
      }
      cursor = Math.max(cursor, be);
    }
    // Gap after last busy block
    while (cursor + duration <= workEnd) {
      slots.push({ date: dateStr, start: cursor, end: cursor + duration, dateObj: date });
      cursor += duration;
    }
  }

  const list = document.getElementById('slotsList');
  if (slots.length === 0) {
    list.innerHTML = '<div class="empty-state">No free slots found in the next ' + daysAhead + ' days during work hours.</div>';
    return;
  }

  // Show at most 30 slots
  const shown = slots.slice(0, 30);
  list.innerHTML = shown.map(s => {
    const label = s.dateObj.toLocaleDateString('en-US', { weekday:'short', month:'short', day:'numeric' });
    return `<div class="slot-item" data-date="${s.date}" data-start="${minsToTime(s.start)}" data-end="${minsToTime(s.end)}">
      ${label} &bull; ${minsToTime(s.start)}–${minsToTime(s.end)}
    </div>`;
  }).join('');

  // Click slot → pre-fill add event modal
  list.querySelectorAll('.slot-item').forEach(item => {
    item.addEventListener('click', () => {
      state.editingId = null;
      document.getElementById('evDate').value = item.dataset.date;
      document.getElementById('evStart').value = item.dataset.start;
      document.getElementById('evEnd').value = item.dataset.end;
      document.getElementById('evTitle').value = '';
      document.getElementById('evPerson').value = 'shared';
      document.getElementById('evNotes').value = '';
      document.getElementById('modalTitle').textContent = 'Add Event (Free Slot)';
      document.getElementById('deleteEventBtn').style.display = 'none';
      buildColorPicker(COLORS[2]);
      document.getElementById('eventModal').classList.add('open');
      document.getElementById('evTitle').focus();
    });
  });
}

document.getElementById('findSlotsBtn').addEventListener('click', () => {
  state.freeSlotsOpen = !state.freeSlotsOpen;
  document.getElementById('freeSlotsPanel').classList.toggle('open', state.freeSlotsOpen);
  if (state.freeSlotsOpen) renderFreeSlots();
});

document.getElementById('refreshSlots').addEventListener('click', renderFreeSlots);

// ─────────────────────────────────────────────
//  INIT
// ─────────────────────────────────────────────
load();
renderAll();
</script>
